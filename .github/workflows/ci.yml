name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package validation
        run: bash tests/validate-package.sh

  lint-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trailing whitespace check
        run: |
          if grep -RIn "[[:blank:]]$" -- . --exclude-dir=.git --exclude-dir=.worktrees; then
            echo "Trailing whitespace found"
            exit 1
          fi
      - name: End-of-file newline check
        run: |
          python3 -c "
          from pathlib import Path
          bad=[]
          ext = {'.md','.json','.yml','.yaml','.sh','.ps1','.py'}
          for p in Path('.').rglob('*'):
              if p.is_file() and '.git' not in p.parts and '.worktrees' not in p.parts and p.suffix in ext:
                  b=p.read_bytes()
                  if b and not b.endswith(b'\n'): bad.append(str(p))
          if bad:
              print('Missing final newline:', *bad, sep='\n')
              raise SystemExit(1)
          "
      - name: YAML syntax check
        run: |
          python3 -c "
          try:
              import yaml
          except Exception:
              print('PyYAML unavailable; skipping')
              raise SystemExit(0)
          from pathlib import Path
          ok=0
          for p in list(Path('.').rglob('*.yml'))+list(Path('.').rglob('*.yaml')):
              if '.git' in p.parts or '.worktrees' in p.parts: continue
              if 'pre-commit-config' in str(p):
                  print(f'Skipping (pre-existing embedded heredocs): {p}')
                  continue
              yaml.safe_load(p.read_text())
              ok+=1
          print(f'YAML syntax OK ({ok} files)')
          "

  markdown-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'
          config: '.markdownlint.json'

  spell-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: streetsidesoftware/cspell-action@e0668cf020899e887ee8ad4d173c31738a79eae8 # v9.0.1
        with:
          files: '**/*.md'
          config: '.cspell.json'

  link-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Live link validation
        run: bash tests/validate-links.sh

  nori-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate nori.json schema
        run: python3 tests/validate-schema.py
