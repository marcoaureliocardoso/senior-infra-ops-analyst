name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CI_ISOLATION_REPORT: ${{ runner.temp }}/ci-isolation-report.json
    # Keep the full-gate budget aligned with CI package-validate.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare guarded image and verified namespace runtime
        id: isolation_prepare
        run: python3 tests/ci_isolation_bootstrap.py --prepare --manifest tests/ci-runtime-lock.json --report "$CI_ISOLATION_REPORT"
      - name: Provision test-only terminal runtime
        id: terminal_provision
        run: |
          terminal_node="$(readlink -f "$(command -v node)")"
          terminal_npm="$(readlink -f "$(command -v npm)")"
          python3 tests/provision-terminal-runtime.py --target "$RUNNER_TEMP/p004b-terminal-runtime" --npm "$terminal_npm" --node "$terminal_node"
          printf 'P004B_TERMINAL_NODE=%s\n' "$terminal_node" >> "$GITHUB_ENV"
          printf 'P004B_TERMINAL_MODULE_ROOT=%s\n' "$RUNNER_TEMP/p004b-terminal-runtime/node_modules" >> "$GITHUB_ENV"
      - name: Verify required isolation and real helper audit
        id: isolation_verify
        run: python3 tests/ci_isolation_bootstrap.py --verify --manifest tests/ci-runtime-lock.json --report "$CI_ISOLATION_REPORT"
      - name: Full package validation
        id: package_gate
        run: bash tests/validate-package.sh
      - name: Schema validation
        run: python3 tests/validate-schema.py
      - name: Clean owned namespace runtime and policy
        id: isolation_cleanup
        if: always()
        run: python3 tests/ci_isolation_bootstrap.py --cleanup --manifest tests/ci-runtime-lock.json --report "$CI_ISOLATION_REPORT"

  release:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify version consistency
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          NORI_VERSION=$(python3 -c "import json; print(json.load(open('nori.json'))['version'])")
          if [ "$TAG_VERSION" != "$NORI_VERSION" ]; then
            echo "ERROR: tag version v${TAG_VERSION} != nori.json version ${NORI_VERSION}"
            exit 1
          fi
          echo "Version ${TAG_VERSION} is consistent — proceeding with release"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
